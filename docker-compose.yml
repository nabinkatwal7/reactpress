services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # 5433 avoids clashing with an existing local Postgres on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: reactpress
      POSTGRES_PASSWORD: reactpress
      POSTGRES_DB: reactpress
    volumes:
      - reactpress_pg:/var/lib/postgresql/data

volumes:
  reactpress_pg:
